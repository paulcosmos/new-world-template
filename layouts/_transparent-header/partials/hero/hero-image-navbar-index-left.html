<div class="hero-head">
	{{ partial "navbar.html" . }}
</div>

<div class="hero-body">
	<div class="container is-fullhd">
		<div class="columns _is-centered">
			<div class="column is-12-tablet is-10-desktop is-8-widescreen is-7-fullhd">
				<div class="content hero-services-content has-accent">
					{{ .Content }}
				</div>
				<div class="content hero-index-description">
					<p>Over {{.Site.Params.years}} of experience in {{.Site.Params.industry}}.</p>
				</div>

				<div class="columns is-multiline is-vcentered is-variable is-2 mt-4">
					<div class="column is-12-mobile is-6-tablet is-6-desktop is-6-fullhd" data-aos="fade-up" data-aos-delay="200">
						<a href='tel:{{ replaceRE "(\\s)" "" .Site.Params.phone | }}' class="button button-primary is-fullwidth"><i class="fa-light fa-phone pr-2"></i>Call now: {{.Site.Params.phone}}</a>
					</div>
					<div class="column is-12-mobile is-6-tablet is-6-desktop is-6-fullhd" data-aos="fade-up" data-aos-delay="400">
						<a href="#" class="button button-outline is-fullwidth modal-trigger ml-0 mr-1" data-target="quote-modal"><i class="fa-light fa-envelope-circle-check pr-2"></i>Get a FREE Quote</a>
					</div>
				</div>

				<div class="columns is-mobile is-variable is-multiline selling-points">
					<div class="column is-6-mobile is-3-tablet is-3-desktop">
						<div>
							<span class="icon">
								<i class="fa-sharp fa-2x fa-regular fa-shield-check"></i>
							</span>
							<p>Fully <br/>Qualified</p>
						</div>
					</div>
					<div class="column is-6-mobile is-3-tablet is-3-desktop">
						<div>
							<span class="icon">
								<i class="fas fa-2x fa-regular fa-award-simple"></i>
							</span>
							<p>Quality <br/>Materials</p>
						</div>
					</div>
					<div class="column is-6-mobile is-3-tablet is-3-desktop">
						<div>
							<span class="icon">
								<i class="fa-regular fa-2x fa-hammer"></i>
							</span>
							<p>Excellent <br/>Workmanship</p>
						</div>
					</div>
					<div class="column is-6-mobile is-3-tablet is-3-desktop">
						<div>
							<span class="icon">
								<i class="fa-regular s fa-2x fa-trophy"></i>
							</span>
							<p>Highly <br/>Experienced</p>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
</div>
